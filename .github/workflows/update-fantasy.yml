
name: Update Fantasy Dashboard

on:
  schedule:
    # Run every day at 10 AM Eastern during daylight saving time
    # and 9 AM Eastern during standard time.
    - cron: "0 14 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update ESPN predictions
        run: python update.py

      - name: Publish updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m "Update fantasy predictions"
            git push
          fi
