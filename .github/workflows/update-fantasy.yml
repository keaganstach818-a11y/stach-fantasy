
name: Update Stach Fantasy Football

on:
  schedule:
    # Tuesdays at 10:00 AM Eastern during daylight saving time
    - cron: "0 14 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stach-fantasy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch ESPN data and update predictions
        run: python update.py

      - name: Publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update fantasy predictions"
            git push
          fi
